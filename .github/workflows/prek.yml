name: Pre-commit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run prek
        uses: j178/prek-action@v3.0.1
